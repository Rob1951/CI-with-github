name: Python CI

on:
  push:
    branches: [ "main", "add-dockerfile" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install flask

    - name: Test import
      run: |
        python -c "import flask"
